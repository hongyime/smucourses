name: Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Test saved selections
        run: npm test
      - name: Build static website and check TypeScript
        run: npm run build
      - name: Validate maintenance opt-in
        working-directory: .
        run: |
          python3 .github/scripts/branch-heartbeat.py --validate-config .github/branch-heartbeat.json
          python3 -m compileall -q .github/scripts
