name: Archive Syllabi

on:
  push:
    branches: [main]
    paths:
      - data/documents_raw.json
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: syllabi-archive-v2-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Create archive release if needed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if ! gh release view syllabi-archive-v2 >/dev/null 2>&1; then
            gh release create syllabi-archive-v2 \
              --title "Syllabi archive v2" \
              --notes "$(printf 'Backup export of Coursedog syllabi.\n\n<!-- syllabi-archive-index:  -->')" \
              --latest=false
          fi
      - name: Archive new syllabi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: python scripts/archive_syllabi.py
